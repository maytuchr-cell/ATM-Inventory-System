<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมุดบันทึกที่อยู่ — ATM Inventory</title>
    <link rel="stylesheet" href="shared/styles.css?v=77">
    <style>
        .section-head { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
        .section-accent { width:4px; height:22px; background:var(--orange); border-radius:2px; }
        .section-title  { font-size:17px; font-weight:700; color:var(--text-primary); }
        .text-muted { color:var(--text-muted); }

        .addr-topbar { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border); background:var(--bg-card); }
        .addr-back { display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; color:var(--text-secondary); text-decoration:none; }
        .addr-back:hover { color:var(--orange); }
        .addr-title { font-size:15px; font-weight:700; color:var(--text-primary); }

        .addr-card {
            border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px;
            background:var(--bg-card); display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
        }
        .addr-card-label { font-weight:700; font-size:14px; color:var(--text-primary); }
        .addr-card-text { font-size:13px; color:var(--text-secondary); margin-top:4px; white-space:pre-wrap; }
        .addr-card-actions { display:flex; gap:6px; flex-shrink:0; }
        .addr-icon-btn {
            border:1px solid var(--border); background:var(--bg-subtle); border-radius:8px; width:32px; height:32px;
            display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;
        }
        .addr-icon-btn:hover { background:var(--orange-light); }
        .addr-icon-btn.danger:hover { background:var(--red-light); }

        .addr-form { border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:18px; background:var(--bg-subtle); }
        .addr-form label { font-size:11px; color:var(--text-muted); display:block; margin-bottom:4px; }
        .addr-form input, .addr-form textarea { margin-bottom:12px; }
    </style>
</head>
<body>

<div class="addr-topbar">
    <a class="addr-back" href="tech.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        กลับ
    </a>
    <span class="addr-title">📍 สมุดบันทึกที่อยู่</span>
</div>

<div class="page-body" style="max-width:560px;margin:0 auto;">
    <div class="card">
        <div class="card-body">
            <div class="section-head">
                <div class="section-accent"></div>
                <span class="section-title">ที่อยู่ของฉัน</span>
                <button class="btn-withdraw" style="margin-left:auto;" onclick="openAddForm()">＋ เพิ่มที่อยู่</button>
            </div>

            <div id="addrFormWrap" style="display:none;" class="addr-form">
                <label>ชื่อที่อยู่ (เช่น บ้าน, สาขาสีลม)</label>
                <input id="addrLabel" type="text" class="select-part" placeholder="ตั้งชื่อให้จำง่าย">
                <label>ที่อยู่เต็ม</label>
                <textarea id="addrText" class="form-textarea" style="min-height:70px;" placeholder="กรอกที่อยู่เต็ม..."></textarea>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-ghost" style="width:auto;" onclick="closeAddrForm()">ยกเลิก</button>
                    <button class="btn btn-primary" style="width:auto;" onclick="saveAddress()">บันทึก</button>
                </div>
            </div>

            <div id="addrList"></div>
            <div id="addrEmpty" class="text-muted" style="display:none;padding:20px 0;text-align:center;">
                ยังไม่มีที่อยู่ที่บันทึกไว้ — กด "เพิ่มที่อยู่" เพื่อเริ่มต้น
            </div>
        </div>
    </div>
</div>

<script src="shared/toast.js?v=77"></script>
<script src="shared/api.js?v=77"></script>
<script src="shared/layout.js?v=77"></script>
<script>
    if (!localStorage.getItem('authToken')) {
        window.location.replace('login-tech.html');
    }
    // No sidebar on this page (custom top bar instead) — call the role guard directly since
    // initLayout() never runs here to do it.
    guardPageAccess();
    const currentEmail = localStorage.getItem('userEmail') || 'tech@atm.com';
    let editingId = null;
    let cachedAddresses = [];

    async function loadAddresses() {
        try {
            cachedAddresses = await api.savedAddresses.getAll(currentEmail);
        } catch (err) {
            showToast('โหลดที่อยู่ไม่สำเร็จ: ' + err.message, 'error');
            cachedAddresses = [];
        }
        renderAddresses();
    }

    function renderAddresses() {
        const listEl = document.getElementById('addrList');
        const emptyEl = document.getElementById('addrEmpty');
        if (!cachedAddresses.length) {
            listEl.innerHTML = '';
            emptyEl.style.display = 'block';
            return;
        }
        emptyEl.style.display = 'none';
        listEl.innerHTML = cachedAddresses.map(a => `
            <div class="addr-card">
                <div>
                    <div class="addr-card-label">${a.label}</div>
                    <div class="addr-card-text">${a.address}</div>
                </div>
                <div class="addr-card-actions">
                    <button class="addr-icon-btn" title="แก้ไข" onclick="openEditForm(${a.savedAddressId})">✏️</button>
                    <button class="addr-icon-btn danger" title="ลบ" onclick="deleteAddress(${a.savedAddressId})">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function openAddForm() {
        editingId = null;
        document.getElementById('addrLabel').value = '';
        document.getElementById('addrText').value = '';
        document.getElementById('addrFormWrap').style.display = 'block';
    }
    function openEditForm(id) {
        const addr = cachedAddresses.find(a => a.savedAddressId === id);
        if (!addr) return;
        editingId = id;
        document.getElementById('addrLabel').value = addr.label;
        document.getElementById('addrText').value = addr.address;
        document.getElementById('addrFormWrap').style.display = 'block';
    }
    function closeAddrForm() {
        editingId = null;
        document.getElementById('addrFormWrap').style.display = 'none';
    }

    async function saveAddress() {
        const label = document.getElementById('addrLabel').value.trim();
        const address = document.getElementById('addrText').value.trim();
        if (!label) { showToast('กรุณาตั้งชื่อที่อยู่', 'error'); return; }
        if (!address) { showToast('กรุณากรอกที่อยู่', 'error'); return; }
        try {
            if (editingId) {
                await api.savedAddresses.update(editingId, { techEmail: currentEmail, label, address });
                showToast('แก้ไขที่อยู่แล้ว');
            } else {
                await api.savedAddresses.create({ techEmail: currentEmail, label, address });
                showToast('บันทึกที่อยู่แล้ว');
            }
            closeAddrForm();
            await loadAddresses();
        } catch (err) {
            showToast('บันทึกไม่สำเร็จ: ' + err.message, 'error');
        }
    }

    async function deleteAddress(id) {
        if (!confirm('ลบที่อยู่นี้?')) return;
        try {
            await api.savedAddresses.remove(id, currentEmail);
            showToast('ลบที่อยู่แล้ว');
            await loadAddresses();
        } catch (err) {
            showToast('ลบไม่สำเร็จ: ' + err.message, 'error');
        }
    }

    loadAddresses();
</script>
</body>
</html>
