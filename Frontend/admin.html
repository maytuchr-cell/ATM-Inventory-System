<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — ATM Inventory</title>
    <link rel="stylesheet" href="shared/styles.css">
    <style>
        /* Page-specific overrides */
        .section-head { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
        .section-accent { width:4px; height:22px; background:var(--orange); border-radius:2px; flex-shrink:0; }
        .section-title  { font-size:16px; font-weight:700; color:var(--text-primary); }
        .section-count  { font-size:12px; font-weight:600; background:var(--bg-subtle); color:var(--text-secondary); padding:2px 9px; border-radius:20px; border:1px solid var(--border); }

        /* Badge variants */
        .badge-pending  { background:var(--yellow-light); color:var(--yellow); }
        .badge-pending  .badge-dot { background:var(--yellow); }
        .badge-approved { background:var(--orange-light); color:var(--orange); }
        .badge-approved .badge-dot { background:var(--orange); }
        .badge-success  { background:var(--green-light);  color:var(--green); }
        .badge-success  .badge-dot { background:var(--green); }
        .badge-danger   { background:var(--red-light);    color:var(--red);   }
        .badge-danger   .badge-dot { background:var(--red); }
        .badge-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

        /* Action buttons inside table */
        .btn-approve { background:var(--green-light); color:var(--green); border:1.5px solid transparent; width:100%; justify-content:center; padding:7px; margin-bottom:5px; border-radius:8px; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all .15s; }
        .btn-approve:hover { background:var(--green); color:#fff; }
        .btn-reject  { background:var(--red-light);   color:var(--red);   border:1.5px solid transparent; width:100%; justify-content:center; padding:7px; border-radius:8px; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all .15s; }
        .btn-reject:hover  { background:var(--red);   color:#fff; }

        .select-part { width:100%; padding:7px 10px; margin-bottom:7px; border-radius:8px; background:var(--bg-input); color:var(--text-primary); border:1.5px solid var(--border); font-family:inherit; font-size:13px; transition:.2s; outline:none; }
        .select-part:focus { border-color:var(--orange); box-shadow:0 0 0 3px var(--orange-ring); }

        .id-chip    { font-size:12px; font-weight:600; color:var(--text-muted); background:var(--bg-subtle); padding:3px 8px; border-radius:5px; font-family:'Inter',monospace; border:1px solid var(--border); }
        .ticket-id  { color:var(--orange); }
        .text-green { color:var(--green); font-weight:600; }
        .text-red   { color:var(--red);   font-weight:600; }
        .fw-600     { font-weight:600; }
        .fs-13      { font-size:13px; }

        /* Detail button */
        .btn-detail { background:var(--bg-subtle); color:var(--text-secondary); border:1.5px solid var(--border); padding:5px 10px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; display:inline-flex; align-items:center; gap:4px; margin-top:5px; width:100%; justify-content:center; }
        .btn-detail:hover { background:var(--orange-light); color:var(--orange); border-color:var(--orange); }

        /* Ticket detail modal */
        .detail-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:900; align-items:center; justify-content:center; padding:20px; }
        .detail-overlay.open { display:flex; }
        .detail-modal { background:var(--bg-card); border-radius:18px; border:1px solid var(--border); width:100%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
        .detail-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg-card); z-index:1; border-radius:18px 18px 0 0; }
        .detail-title { font-size:16px; font-weight:700; color:var(--text-primary); }
        .detail-close { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:6px; display:flex; align-items:center; }
        .detail-close:hover { color:var(--text-primary); background:var(--bg-subtle); }
        .detail-body { padding:24px; }
        .detail-section { margin-bottom:20px; }
        .detail-section-title { font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--orange); margin-bottom:12px; }
        .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .detail-field label { font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:.4px; text-transform:uppercase; display:block; margin-bottom:3px; }
        .detail-field span  { font-size:14px; color:var(--text-primary); font-weight:500; }
        .detail-field.full  { grid-column:1/-1; }
        .detail-desc { font-size:14px; color:var(--text-primary); line-height:1.6; background:var(--bg-subtle); border-radius:8px; padding:12px; border:1px solid var(--border); white-space:pre-wrap; }
        .detail-img { width:100%; border-radius:10px; border:1px solid var(--border); margin-top:4px; object-fit:contain; max-height:300px; cursor:zoom-in; }
        .detail-divider { border:none; border-top:1px solid var(--border); margin:16px 0; }
        .detail-empty { color:var(--text-muted); font-style:italic; font-size:13px; }
    </style>
</head>
<body>

<div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content">
        <!-- Top bar -->
        <div class="topbar">
            <div>
                <div class="topbar-title" data-i18n="admin.title">Admin Dashboard</div>
                <div class="topbar-sub"   data-i18n="inv.section">Inventory Stock</div>
            </div>
        </div>

        <!-- Page body -->
        <div class="page-body">

            <!-- Top/Bottom + Aging + Recurrent (3-up) -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;">
                <div class="card" style="margin-bottom:0;">
                    <div class="section-head">
                        <div class="section-accent"></div>
                        <span class="section-title" data-i18n="dash.topbottom">Top / Bottom Issued Parts</span>
                    </div>
                    <div style="padding:0 20px 20px;">
                        <div style="font-size:12px;font-weight:700;color:var(--orange);margin-bottom:8px;" data-i18n="dash.top20">Top 20</div>
                        <div id="top20-list" style="font-size:13px;"></div>
                        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin:14px 0 8px;" data-i18n="dash.bottom20">Bottom 20</div>
                        <div id="bottom20-list" style="font-size:13px;"></div>
                    </div>
                </div>
                <div class="card" style="margin-bottom:0;">
                    <div class="section-head">
                        <div class="section-accent"></div>
                        <span class="section-title" data-i18n="dash.aging">Aging Stock</span>
                    </div>
                    <div id="aging-list" style="padding:0 20px 20px;font-size:13px;"></div>
                    <div class="section-head" style="margin-top:8px;">
                        <div class="section-accent"></div>
                        <span class="section-title" data-i18n="dash.recurrent">Recurrent Failures</span>
                    </div>
                    <div id="recurrent-list" style="padding:0 20px 20px;font-size:13px;"></div>
                </div>
            </div>

            <!-- Inventory Stock -->
            <div class="card">
                <div class="section-head" style="flex-wrap:wrap;gap:8px;">
                    <div class="section-accent"></div>
                    <span class="section-title" data-i18n="inv.section">Inventory Stock</span>
                    <span class="section-count" id="parts-count">—</span>
                    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
                        <input id="inv-search" type="text" placeholder="🔍 Search part…"
                            oninput="renderPartsCards()"
                            style="padding:5px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:var(--surface);color:var(--text);outline:none;width:200px;">
                        <select id="inv-stock-filter" onchange="renderPartsCards()"
                            style="padding:5px 8px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:var(--surface);color:var(--text);">
                            <option value="">All Stock</option>
                            <option value="low">Low / Out</option>
                            <option value="ok">OK</option>
                        </select>
                    </div>
                </div>
                <div id="inv-zones-wrap" style="padding:0 20px 20px;"></div>
            </div>

            <!-- Withdrawal Requests -->
            <div class="card">
                <div class="section-head">
                    <div class="section-accent"></div>
                    <span class="section-title" data-i18n="tkt.section">Withdrawal Requests</span>
                    <span class="section-count" id="tickets-count">—</span>
                </div>
                <div class="tbl-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:7%"  data-i18n="tkt.ticket">Ticket</th>
                                <th style="width:12%" data-i18n="tkt.tech">Technician</th>
                                <th style="width:10%" data-i18n="tkt.dept">Department</th>
                                <th style="width:14%" data-i18n="tkt.requested">Requested Part</th>
                                <th style="width:14%" data-i18n="tkt.issued">Issued Part</th>
                                <th style="width:11%" data-i18n="tkt.status">Status</th>
                                <th style="width:20%" data-i18n="tkt.action">Action</th>
                                <th style="width:12%">รายละเอียด</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsTableBody">
                            <tr><td colspan="8" class="empty-state"><span data-i18n="connecting">Connecting to server…</span></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div><!-- /page-body -->
    </div><!-- /main-content -->
</div><!-- /app-layout -->

<!-- Ticket Detail Modal -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
    <div class="detail-modal" id="detailModal">
        <div class="detail-header">
            <span class="detail-title" id="detailTitle">Ticket Detail</span>
            <button class="detail-close" onclick="closeDetailModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="detail-body" id="detailBody"></div>
    </div>
</div>

<script src="shared/translations.js?v=3"></script>
<script src="shared/toast.js"></script>
<script src="shared/api.js"></script>
<script src="shared/layout.js"></script>
<script>
    const TICKET_URL = API_BASE.replace(/\/api$/, "") + "/api/Ticket";
    let globalParts  = [];
    let cachedParts  = [];
    let cachedTickets = [];

    /* ── Init ── */
    initLayout();
    applyLang();
    function onLangChange() { renderPartsCards(); renderTicketsTable(); fetchDashboard(); }

    window.onload = async function () { await fetchParts(); fetchTickets(); fetchDashboard(); };

    /* ── Dashboard widgets ── */
    async function fetchDashboard() {
        try {
            const [topBottom, aging, recurrent] = await Promise.all([
                api.dashboard.topBottom(),
                api.dashboard.aging(30), api.dashboard.recurrentFailures(30)
            ]);
            renderTopBottom(topBottom);
            renderAging(aging);
            renderRecurrent(recurrent);
        } catch (e) { console.error(e); }
    }

    function renderTopBottom(data) {
        const fmt = list => list.length
            ? list.map(x => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);"><span>${x.partName}</span><span class="fw-600">${x.count}</span></div>`).join('')
            : `<span style="color:var(--text-muted)">—</span>`;
        document.getElementById('top20-list').innerHTML = fmt(data.top20.slice(0, 5));
        document.getElementById('bottom20-list').innerHTML = fmt(data.bottom20.slice(0, 5));
    }

    function renderAging(list) {
        const el = document.getElementById('aging-list');
        el.innerHTML = list.length
            ? list.slice(0, 5).map(a => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);"><span>${a.partName}</span><span class="text-red">${a.agingDays} ${t('dash.aging.days')}</span></div>`).join('')
            : `<span style="color:var(--text-muted)">${t('dash.aging.empty')}</span>`;
    }

    function renderRecurrent(list) {
        const el = document.getElementById('recurrent-list');
        el.innerHTML = list.length
            ? list.slice(0, 5).map(r => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);"><span>${r.techName} — ${r.partName}</span><span class="text-red fw-600">${r.count}×</span></div>`).join('')
            : `<span style="color:var(--text-muted)">${t('dash.recurrent.empty')}</span>`;
    }

    /* ── Parts ── */
    async function fetchParts() {
        try {
            globalParts = await api.parts.getAll({ isActive: true });
            cachedParts = globalParts;
            renderPartsCards();
        } catch {
            document.getElementById('inv-zones-wrap').innerHTML =
                `<div style="text-align:center;color:var(--red);padding:32px;">${t('error.connect')}</div>`;
        }
    }
    // Parts list is grouped two levels deep so it stays scannable: Device Type (outer) →
    // Zone (inner). Device Type comes from Part.DeviceType (parsed from the GRG catalog's
    // free-text "Remark" column, e.g. "ADM,GHB,BOC,VTM" -> "ADM"; a part can carry more than
    // one type, e.g. "ADM,ATM", and then appears under both). Zone comes from Part.Zone
    // (from the catalog's Sub Unit = "Upper Unit"/"Lower Unit"). Neither is guessed —
    // parts with no confirmed value land in the "Unknown"/"Not Categorized" bucket.
    const DEVICE_GROUPS = [
        { key: 'ATM',     labelKey: 'inv.device.atm',     fallback: 'ATM' },
        { key: 'ADM',     labelKey: 'inv.device.adm',     fallback: 'ADM' },
        { key: 'CDM',     labelKey: 'inv.device.cdm',     fallback: 'CDM' },
        { key: 'Unknown', labelKey: 'inv.device.unknown', fallback: 'Not Specified' },
    ];
    const ZONE_GROUPS = [
        { key: 'Upper',   labelKey: 'inv.zone.upper',   fallback: 'Upper Unit' },
        { key: 'Lower',   labelKey: 'inv.zone.lower',   fallback: 'Lower Unit' },
        { key: 'Unknown', labelKey: 'inv.zone.unknown', fallback: 'Not Categorized' },
    ];
    const collapsedGroups = new Set(); // "device:KEY" / "device:KEY|zone:KEY" collapsed-group ids

    function partCardHtml(p) {
        const low  = p.stockQuantity <= (p.reorderPoint || 3);
        const zero = p.stockQuantity === 0;
        const pillCls = zero ? 'danger' : low ? 'warn' : 'ok';
        const border  = zero ? 'var(--red)' : low ? 'var(--orange)' : 'var(--border)';
        return `<div style="
                border:1.5px solid ${border};
                border-radius:10px;
                padding:12px 14px;
                background:var(--surface);
                display:flex;flex-direction:column;gap:6px;
                transition:box-shadow .15s;
            " onmouseover="this.style.boxShadow='0 2px 10px rgba(0,0,0,.08)'"
               onmouseout="this.style.boxShadow='none'">
            <div style="font-size:10.5px;color:var(--text-secondary);font-family:monospace;">${p.partNo}</div>
            <div style="font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35;flex:1;">${p.partName}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
                <span class="stock-pill ${pillCls}" style="font-size:12px;">
                    ${p.stockQuantity} <span style="font-weight:400;font-size:11px;">${t('inv.units')}</span>
                </span>
                ${p.category?.name ? `<span style="font-size:10px;color:var(--text-secondary);background:var(--bg);border-radius:5px;padding:2px 6px;">${p.category.name}</span>` : ''}
            </div>
        </div>`;
    }

    function toggleGroup(id) {
        if (collapsedGroups.has(id)) collapsedGroups.delete(id); else collapsedGroups.add(id);
        renderPartsCards();
    }

    // Renders one collapsible header + body. `depth` only affects indent/font size so the
    // inner Zone groups read as nested under the outer Device Type group.
    function groupHtml(id, label, count, depth, bodyHtml) {
        const collapsed = collapsedGroups.has(id);
        return `
            <div style="margin-bottom:${depth === 0 ? 14 : 10}px;${depth ? `margin-left:${depth * 16}px;` : ''}">
                <div onclick="toggleGroup('${id}')" style="
                    display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
                    padding:${depth === 0 ? '8px 12px' : '6px 10px'};background:${depth === 0 ? 'var(--bg-subtle)' : 'var(--surface)'};
                    border-radius:8px;border:1px solid var(--border);
                ">
                    <span style="font-size:12px;transition:transform .15s;display:inline-block;transform:rotate(${collapsed ? '-90' : '0'}deg);">▾</span>
                    <span style="font-size:${depth === 0 ? '13.5px' : '12.5px'};font-weight:700;color:var(--text-primary);">${label}</span>
                    <span class="section-count">${count}</span>
                </div>
                ${collapsed ? '' : `<div style="margin-top:8px;">${bodyHtml}</div>`}
            </div>`;
    }

    function renderPartsCards() {
        const search = (document.getElementById('inv-search')?.value || '').toLowerCase();
        const stockF = document.getElementById('inv-stock-filter')?.value || '';
        const wrap   = document.getElementById('inv-zones-wrap');

        let rows = cachedParts.filter(p => {
            if (search && !p.partName.toLowerCase().includes(search) && !p.partNo.toLowerCase().includes(search)) return false;
            const low = p.stockQuantity <= (p.reorderPoint || 3);
            if (stockF === 'low' && !low) return false;
            if (stockF === 'ok'  &&  low) return false;
            return true;
        });

        document.getElementById('parts-count').textContent =
            rows.length + (getLang()==='th' ? ' รายการ' : ' items');

        if (!rows.length) {
            wrap.innerHTML = `<div style="text-align:center;color:var(--text-secondary);padding:32px;">${t('inv.empty') || 'No parts found'}</div>`;
            return;
        }

        // A part can carry more than one DeviceType tag (e.g. "ADM,ATM") and shows up under each.
        const byDevice = { ATM: [], ADM: [], CDM: [], Unknown: [] };
        rows.forEach(p => {
            const tags = (p.deviceType || '').split(',').map(s => s.trim()).filter(t => ['ATM','ADM','CDM'].includes(t));
            (tags.length ? tags : ['Unknown']).forEach(tag => byDevice[tag].push(p));
        });

        wrap.innerHTML = DEVICE_GROUPS.map(({ key: dKey, labelKey: dLabelKey, fallback: dFallback }) => {
            const parts = byDevice[dKey];
            if (!parts.length) return '';

            const byZone = { Upper: [], Lower: [], Unknown: [] };
            parts.forEach(p => (byZone[p.zone === 'Upper' || p.zone === 'Lower' ? p.zone : 'Unknown']).push(p));

            const zonesHtml = ZONE_GROUPS.map(({ key: zKey, labelKey: zLabelKey, fallback: zFallback }) => {
                const zoneParts = byZone[zKey];
                if (!zoneParts.length) return '';
                const cardsHtml = zoneParts.map(partCardHtml).join('');
                const cardsWrap = `<div style="
                    display:grid;
                    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
                    gap:10px;
                    max-height:400px;
                    overflow-y:auto;
                    scrollbar-width:thin;
                    scrollbar-color:var(--border) transparent;
                ">${cardsHtml}</div>`;
                return groupHtml(`device:${dKey}|zone:${zKey}`, t(zLabelKey) || zFallback, zoneParts.length, 1, cardsWrap);
            }).join('');

            return groupHtml(`device:${dKey}`, t(dLabelKey) || dFallback, parts.length, 0, zonesHtml);
        }).join('');
    }

    /* ── Tickets ── */
    async function fetchTickets() {
        try {
            const res = await fetch(TICKET_URL);
            cachedTickets = await res.json();
            renderTicketsTable();
        } catch (e) { console.error(e); }
    }
    function renderTicketsTable() {
        document.getElementById('tickets-count').textContent = cachedTickets.length + ' ' + (getLang()==='th' ? 'ตั๋ว' : 'tickets');
        const tbody = document.getElementById("ticketsTableBody");
        tbody.innerHTML = "";
        if (!cachedTickets.length) {
            tbody.innerHTML = `<tr><td colspan="8" class="empty-state">🎉 ${t('tkt.none')}</td></tr>`;
            return;
        }
        cachedTickets.forEach(tk => {
            const reqName      = tk.requestedPartNav?.partName || tk.requestedPartNo || '—';
            const approvedName = tk.approvedPartNav?.partName  || tk.approvedPartNo;
            let badge = "", action = `<span style="color:var(--text-muted)">—</span>`;
            let issuedPart = approvedName
                ? `<span class="text-green">${approvedName}</span>`
                : `<span style="color:var(--text-muted)">${t('tkt.pending.review')}</span>`;

            if (tk.status === "Pending") {
                badge = `<span class="badge badge-pending"><span class="badge-dot"></span>${t('status.pending')}</span>`;
                const opts = globalParts.map(p => {
                    const dis = p.stockQuantity <= 0 ? 'disabled' : '';
                    const sel = p.partNo === tk.requestedPartNo ? 'selected' : '';
                    return `<option value="${p.partNo}" ${dis} ${sel}>${p.partName} (${p.stockQuantity} ${t('inv.left')})</option>`;
                }).join('');
                action = `
                    <select id="select-part-${tk.ticketId}" class="select-part">${opts}</select>
                    <div style="display:flex;gap:6px;">
                        <button class="btn-approve" onclick="approveTicketWithSelection(${tk.ticketId})">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                            ${t('tkt.approve')}
                        </button>
                        <button class="btn-reject" onclick="rejectTicket(${tk.ticketId})">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                            ${t('tkt.reject')}
                        </button>
                    </div>`;
            } else if (tk.status === "Approved") {
                badge = `<span class="badge badge-approved"><span class="badge-dot"></span>${t('status.awaiting')}</span>`;
            } else if (tk.status === "Rejected") {
                badge = `<span class="badge badge-danger"><span class="badge-dot"></span>${t('status.rejected')}</span>`;
                issuedPart = `<span style="color:var(--text-muted)">—</span>`;
            } else if (tk.status === "Received") {
                badge = `<span class="badge badge-success"><span class="badge-dot"></span>${t('status.received')}</span>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td><span class="id-chip ticket-id">TK-${tk.ticketId.toString().padStart(4,'0')}</span></td>
                    <td class="fw-600">${tk.techName}</td>
                    <td class="fs-13" style="color:var(--text-secondary)">${tk.techDept}</td>
                    <td>${reqName}</td>
                    <td>${issuedPart}</td>
                    <td>${badge}</td>
                    <td>${action}</td>
                    <td><button class="btn-detail" onclick="showDetail(${tk.ticketId})">🔍 ${t('detail.btn')}</button></td>
                </tr>`;
        });
    }

    async function approveTicketWithSelection(id, forceApprove = false) {
        const partNo = document.getElementById(`select-part-${id}`).value;
        const part   = globalParts.find(p => p.partNo === partNo);
        const label  = part?.partName || partNo;
        if (!forceApprove && !confirm(t('tkt.confirm.approve').replace('{part}', label))) return;
        try {
            const res = await fetch(`${TICKET_URL}/${id}/approve`, {
                method:"PUT", headers:{"Content-Type":"application/json"},
                body: JSON.stringify({ approvedPartNo: partNo, forceApprove })
            });
            if (res.ok) { await fetchParts(); fetchTickets(); }
            else if (res.status === 409) {
                const data = await res.json();
                if (data.bufferWarning) {
                    const msg = `⚠ ${data.message}\n\nApprove anyway?`;
                    if (confirm(msg)) approveTicketWithSelection(id, true);
                } else {
                    showToast(data.message || t('tkt.err.approve'), 'error');
                }
            } else {
                const data = await res.json().catch(() => ({}));
                showToast(data.message || t('tkt.err.approve'), 'error');
            }
        } catch { showToast(t('toast.network'), 'error'); }
    }

    async function rejectTicket(id) {
        if (!confirm(t('tkt.confirm.reject'))) return;
        try {
            const res = await fetch(`${TICKET_URL}/${id}/reject`, { method:"PUT" });
            if (res.ok) fetchTickets();
        } catch {}
    }

    /* ── Ticket Detail Modal ── */
    const IMG_BASE = API_BASE.replace(/\/api$/, '');

    function showDetail(id) {
        const tk = cachedTickets.find(t => t.ticketId === id);
        if (!tk) return;

        const reqName      = tk.requestedPartNav?.partName || tk.requestedPartNo || '—';
        const approvedName = tk.approvedPartNav?.partName  || tk.approvedPartNo  || '—';
        const none = `<span class="detail-empty">${t('detail.not.specified')}</span>`;
        const fmt  = d => d ? new Date(d).toLocaleString(getLang()==='th' ? 'th-TH' : 'en-GB') : '—';

        const imgHtml = tk.attachmentPath
            ? `<img src="${IMG_BASE}${tk.attachmentPath}" class="detail-img" alt="Attachment"
                    onclick="window.open('${IMG_BASE}${tk.attachmentPath}','_blank')">`
            : `<div style="padding:16px;text-align:center;background:var(--bg-subtle);border-radius:8px;color:var(--text-muted);font-size:13px;">${t('detail.no.image')}</div>`;

        document.getElementById('detailTitle').textContent =
            `TK-${id.toString().padStart(4,'0')} — ${tk.techName}`;

        document.getElementById('detailBody').innerHTML = `
            <div class="detail-section">
                <div class="detail-section-title">${t('detail.tech')}</div>
                <div class="detail-grid">
                    <div class="detail-field">
                        <label>${t('detail.name')}</label><span>${tk.techName || none}</span>
                    </div>
                    <div class="detail-field">
                        <label>${t('detail.dept')}</label><span>${tk.techDept || none}</span>
                    </div>
                    <div class="detail-field">
                        <label>${t('detail.phone')}</label><span>${tk.techPhone || none}</span>
                    </div>
                    <div class="detail-field">
                        <label>${t('detail.date')}</label><span>${fmt(tk.createdAt)}</span>
                    </div>
                </div>
            </div>

            <hr class="detail-divider">

            <div class="detail-section">
                <div class="detail-section-title">${t('detail.parts')}</div>
                <div class="detail-grid">
                    <div class="detail-field">
                        <label>${t('detail.requested')}</label><span>${reqName}</span>
                    </div>
                    <div class="detail-field">
                        <label>${t('detail.approved')}</label><span>${approvedName}</span>
                    </div>
                    <div class="detail-field">
                        <label>${t('detail.status')}</label><span>${tk.status}</span>
                    </div>
                    <div class="detail-field">
                        <label>${t('detail.due')}</label><span>${fmt(tk.dueDate)}</span>
                    </div>
                </div>
            </div>

            <hr class="detail-divider">

            <div class="detail-section">
                <div class="detail-section-title">${t('detail.faulty')}</div>
                <div class="detail-grid">
                    <div class="detail-field">
                        <label>${t('detail.sn')}</label>
                        <span>${tk.faultySerialNo || none}</span>
                    </div>
                    <div class="detail-field">
                        <label>${t('detail.partno')}</label>
                        <span>${tk.faultyPartNo || none}</span>
                    </div>
                    <div class="detail-field full">
                        <label>${t('detail.model')}</label>
                        <span>${tk.machineModel || none}</span>
                    </div>
                    <div class="detail-field full">
                        <label>${t('detail.desc')}</label>
                        ${tk.description
                            ? `<div class="detail-desc">${tk.description}</div>`
                            : none}
                    </div>
                </div>
            </div>

            <hr class="detail-divider">

            <div class="detail-section">
                <div class="detail-section-title">${t('detail.attachment')}</div>
                ${imgHtml}
            </div>
        `;

        document.getElementById('detailOverlay').classList.add('open');
    }

    function closeDetailModal() {
        document.getElementById('detailOverlay').classList.remove('open');
    }
    function closeDetail(e) {
        if (e.target === document.getElementById('detailOverlay')) closeDetailModal();
    }
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetailModal(); });
</script>
</body>
</html>
