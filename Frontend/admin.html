<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — ATM Inventory</title>
    <link rel="stylesheet" href="shared/styles.css?v=4">
    <style>
        /* Page-specific overrides */
        .section-head { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
        .section-accent { width:4px; height:22px; background:var(--orange); border-radius:2px; flex-shrink:0; }
        .section-title  { font-size:16px; font-weight:700; color:var(--text-primary); }
        .section-count  { font-size:12px; font-weight:600; background:var(--bg-subtle); color:var(--text-secondary); padding:2px 9px; border-radius:20px; border:1px solid var(--border); }
        .fw-600     { font-weight:600; }
        .text-red   { color:var(--red); font-weight:600; }
    </style>
</head>
<body>

<div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content">
        <!-- Top bar -->
        <div class="topbar">
            <div>
                <div class="topbar-title" data-i18n="admin.title">Admin Dashboard</div>
                <div class="topbar-sub"   data-i18n="inv.section">Inventory Stock</div>
            </div>
        </div>

        <!-- Page body -->
        <div class="page-body">

            <!-- Top/Bottom + Aging + Recurrent (3-up) -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;">
                <div class="card" style="margin-bottom:0;">
                    <div class="section-head">
                        <div class="section-accent"></div>
                        <span class="section-title" data-i18n="dash.topbottom">Top / Bottom Issued Parts</span>
                    </div>
                    <div style="padding:0 20px 20px;">
                        <div style="font-size:12px;font-weight:700;color:var(--orange);margin-bottom:8px;" data-i18n="dash.top20">Top 20</div>
                        <div id="top20-list" style="font-size:13px;"></div>
                        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin:14px 0 8px;" data-i18n="dash.bottom20">Bottom 20</div>
                        <div id="bottom20-list" style="font-size:13px;"></div>
                    </div>
                </div>
                <div class="card" style="margin-bottom:0;">
                    <div class="section-head">
                        <div class="section-accent"></div>
                        <span class="section-title" data-i18n="dash.aging">Aging Stock</span>
                    </div>
                    <div id="aging-list" style="padding:0 20px 20px;font-size:13px;"></div>
                    <div class="section-head" style="margin-top:8px;">
                        <div class="section-accent"></div>
                        <span class="section-title" data-i18n="dash.recurrent">Recurrent Failures</span>
                    </div>
                    <div id="recurrent-list" style="padding:0 20px 20px;font-size:13px;"></div>
                </div>
            </div>

            <!-- Inventory Stock -->
            <div class="card">
                <div class="section-head" style="flex-wrap:wrap;gap:8px;">
                    <div class="section-accent"></div>
                    <span class="section-title" data-i18n="inv.section">Inventory Stock</span>
                    <span class="section-count" id="parts-count">—</span>
                    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
                        <input id="inv-search" type="text" placeholder="🔍 Search part…"
                            oninput="renderPartsCards()"
                            style="padding:5px 10px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:var(--surface);color:var(--text);outline:none;width:200px;">
                        <select id="inv-stock-filter" onchange="renderPartsCards()"
                            style="padding:5px 8px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:var(--surface);color:var(--text);">
                            <option value="">All Stock</option>
                            <option value="low">Low / Out</option>
                            <option value="ok">OK</option>
                        </select>
                    </div>
                </div>
                <div id="inv-zones-wrap" style="padding:0 20px 20px;"></div>
            </div>

        </div><!-- /page-body -->
    </div><!-- /main-content -->
</div><!-- /app-layout -->

<script src="shared/translations.js?v=4"></script>
<script src="shared/toast.js?v=4"></script>
<script src="shared/api.js?v=4"></script>
<script src="shared/layout.js?v=4"></script>
<script>
    let globalParts  = [];
    let cachedParts  = [];

    /* ── Init ── */
    initLayout();
    applyLang();
    function onLangChange() { renderPartsCards(); fetchDashboard(); }

    window.onload = async function () { await fetchParts(); fetchDashboard(); };

    /* ── Dashboard widgets ── */
    async function fetchDashboard() {
        try {
            const [topBottom, aging, recurrent] = await Promise.all([
                api.dashboard.topBottom(),
                api.dashboard.aging(30), api.dashboard.recurrentFailures(30)
            ]);
            renderTopBottom(topBottom);
            renderAging(aging);
            renderRecurrent(recurrent);
        } catch (e) { console.error(e); }
    }

    function renderTopBottom(data) {
        const fmt = list => list.length
            ? list.map(x => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);"><span>${x.partName}</span><span class="fw-600">${x.count}</span></div>`).join('')
            : `<span style="color:var(--text-muted)">—</span>`;
        document.getElementById('top20-list').innerHTML = fmt(data.top20.slice(0, 5));
        document.getElementById('bottom20-list').innerHTML = fmt(data.bottom20.slice(0, 5));
    }

    function renderAging(list) {
        const el = document.getElementById('aging-list');
        el.innerHTML = list.length
            ? list.slice(0, 5).map(a => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);"><span>${a.partName}</span><span class="text-red">${a.agingDays} ${t('dash.aging.days')}</span></div>`).join('')
            : `<span style="color:var(--text-muted)">${t('dash.aging.empty')}</span>`;
    }

    function renderRecurrent(list) {
        const el = document.getElementById('recurrent-list');
        el.innerHTML = list.length
            ? list.slice(0, 5).map(r => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);"><span>${r.techName} — ${r.partName}</span><span class="text-red fw-600">${r.count}×</span></div>`).join('')
            : `<span style="color:var(--text-muted)">${t('dash.recurrent.empty')}</span>`;
    }

    /* ── Parts ── */
    async function fetchParts() {
        try {
            globalParts = await api.parts.getAll({ isActive: true });
            cachedParts = globalParts;
            renderPartsCards();
        } catch {
            document.getElementById('inv-zones-wrap').innerHTML =
                `<div style="text-align:center;color:var(--red);padding:32px;">${t('error.connect')}</div>`;
        }
    }
    // Parts list is grouped two levels deep so it stays scannable: Device Type (outer) →
    // Zone (inner). Device Type comes from Part.DeviceType (parsed from the GRG catalog's
    // free-text "Remark" column, e.g. "ADM,GHB,BOC,VTM" -> "ADM"; a part can carry more than
    // one type, e.g. "ADM,ATM", and then appears under both). Zone comes from Part.Zone
    // (from the catalog's Sub Unit = "Upper Unit"/"Lower Unit"). Neither is guessed —
    // parts with no confirmed value land in the "Unknown"/"Not Categorized" bucket.
    const DEVICE_GROUPS = [
        { key: 'ATM',     labelKey: 'inv.device.atm',     fallback: 'ATM' },
        { key: 'ADM',     labelKey: 'inv.device.adm',     fallback: 'ADM' },
        { key: 'CDM',     labelKey: 'inv.device.cdm',     fallback: 'CDM' },
        { key: 'Unknown', labelKey: 'inv.device.unknown', fallback: 'Not Specified' },
    ];
    const ZONE_GROUPS = [
        { key: 'Upper',   labelKey: 'inv.zone.upper',   fallback: 'Upper Unit' },
        { key: 'Lower',   labelKey: 'inv.zone.lower',   fallback: 'Lower Unit' },
        { key: 'Unknown', labelKey: 'inv.zone.unknown', fallback: 'Not Categorized' },
    ];
    const collapsedGroups = new Set(); // "device:KEY" / "device:KEY|zone:KEY" collapsed-group ids

    function partCardHtml(p) {
        const low  = p.stockQuantity <= (p.reorderPoint || 3);
        const zero = p.stockQuantity === 0;
        const pillCls = zero ? 'danger' : low ? 'warn' : 'ok';
        const border  = zero ? 'var(--red)' : low ? 'var(--orange)' : 'var(--border)';
        return `<div style="
                border:1.5px solid ${border};
                border-radius:10px;
                padding:12px 14px;
                background:var(--surface);
                display:flex;flex-direction:column;gap:6px;
                transition:box-shadow .15s;
            " onmouseover="this.style.boxShadow='0 2px 10px rgba(0,0,0,.08)'"
               onmouseout="this.style.boxShadow='none'">
            <div style="font-size:10.5px;color:var(--text-secondary);font-family:monospace;">${p.partNo}</div>
            <div style="font-size:12.5px;font-weight:600;color:var(--text);line-height:1.35;flex:1;">${p.partName}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px;">
                <span class="stock-pill ${pillCls}" style="font-size:12px;">
                    ${p.stockQuantity} <span style="font-weight:400;font-size:11px;">${t('inv.units')}</span>
                </span>
                ${p.category?.name ? `<span style="font-size:10px;color:var(--text-secondary);background:var(--bg);border-radius:5px;padding:2px 6px;">${p.category.name}</span>` : ''}
            </div>
        </div>`;
    }

    function toggleGroup(id) {
        if (collapsedGroups.has(id)) collapsedGroups.delete(id); else collapsedGroups.add(id);
        renderPartsCards();
    }

    // Renders one collapsible header + body. `depth` only affects indent/font size so the
    // inner Zone groups read as nested under the outer Device Type group.
    function groupHtml(id, label, count, depth, bodyHtml) {
        const collapsed = collapsedGroups.has(id);
        return `
            <div style="margin-bottom:${depth === 0 ? 14 : 10}px;${depth ? `margin-left:${depth * 16}px;` : ''}">
                <div onclick="toggleGroup('${id}')" style="
                    display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;
                    padding:${depth === 0 ? '8px 12px' : '6px 10px'};background:${depth === 0 ? 'var(--bg-subtle)' : 'var(--surface)'};
                    border-radius:8px;border:1px solid var(--border);
                ">
                    <span style="font-size:12px;transition:transform .15s;display:inline-block;transform:rotate(${collapsed ? '-90' : '0'}deg);">▾</span>
                    <span style="font-size:${depth === 0 ? '13.5px' : '12.5px'};font-weight:700;color:var(--text-primary);">${label}</span>
                    <span class="section-count">${count}</span>
                </div>
                ${collapsed ? '' : `<div style="margin-top:8px;">${bodyHtml}</div>`}
            </div>`;
    }

    function renderPartsCards() {
        const search = (document.getElementById('inv-search')?.value || '').toLowerCase();
        const stockF = document.getElementById('inv-stock-filter')?.value || '';
        const wrap   = document.getElementById('inv-zones-wrap');

        let rows = cachedParts.filter(p => {
            if (search && !p.partName.toLowerCase().includes(search) && !p.partNo.toLowerCase().includes(search)) return false;
            const low = p.stockQuantity <= (p.reorderPoint || 3);
            if (stockF === 'low' && !low) return false;
            if (stockF === 'ok'  &&  low) return false;
            return true;
        });

        document.getElementById('parts-count').textContent =
            rows.length + (getLang()==='th' ? ' รายการ' : ' items');

        if (!rows.length) {
            wrap.innerHTML = `<div style="text-align:center;color:var(--text-secondary);padding:32px;">${t('inv.empty') || 'No parts found'}</div>`;
            return;
        }

        // A part can carry more than one DeviceType tag (e.g. "ADM,ATM") and shows up under each.
        const byDevice = { ATM: [], ADM: [], CDM: [], Unknown: [] };
        rows.forEach(p => {
            const tags = (p.deviceType || '').split(',').map(s => s.trim()).filter(t => ['ATM','ADM','CDM'].includes(t));
            (tags.length ? tags : ['Unknown']).forEach(tag => byDevice[tag].push(p));
        });

        wrap.innerHTML = DEVICE_GROUPS.map(({ key: dKey, labelKey: dLabelKey, fallback: dFallback }) => {
            const parts = byDevice[dKey];
            if (!parts.length) return '';

            const byZone = { Upper: [], Lower: [], Unknown: [] };
            parts.forEach(p => (byZone[p.zone === 'Upper' || p.zone === 'Lower' ? p.zone : 'Unknown']).push(p));

            const zonesHtml = ZONE_GROUPS.map(({ key: zKey, labelKey: zLabelKey, fallback: zFallback }) => {
                const zoneParts = byZone[zKey];
                if (!zoneParts.length) return '';
                const cardsHtml = zoneParts.map(partCardHtml).join('');
                const cardsWrap = `<div style="
                    display:grid;
                    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
                    gap:10px;
                    max-height:400px;
                    overflow-y:auto;
                    scrollbar-width:thin;
                    scrollbar-color:var(--border) transparent;
                ">${cardsHtml}</div>`;
                return groupHtml(`device:${dKey}|zone:${zKey}`, t(zLabelKey) || zFallback, zoneParts.length, 1, cardsWrap);
            }).join('');

            return groupHtml(`device:${dKey}`, t(dLabelKey) || dFallback, parts.length, 0, zonesHtml);
        }).join('');
    }

</script>
</body>
</html>
