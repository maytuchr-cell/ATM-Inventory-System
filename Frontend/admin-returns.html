<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Returns — ATM Inventory</title>
  <link rel="stylesheet" href="shared/styles.css?v=11">
  <style>
    .badge-teal { background:#e0f5f3; color:#0f8a7e; }
    .badge-teal .badge-dot { background:#0f8a7e; }
    [data-theme="dark"] .badge-teal { background:rgba(15,138,126,.18); color:#4fd6c6; }
    [data-theme="dark"] .badge-teal .badge-dot { background:#4fd6c6; }
    .badge-approved { background:var(--orange-light); color:var(--orange); }
    .badge-approved .badge-dot { background:var(--orange); }
    .btn-confirm { background:var(--green-light); color:var(--green); border:1.5px solid transparent; padding:6px 10px; border-radius:7px; font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
    .btn-confirm:hover { background:var(--green); color:#fff; }
    .btn-detail { background:var(--bg-subtle); color:var(--text-secondary); border:1.5px solid var(--border); padding:5px 10px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; display:inline-flex; align-items:center; gap:4px; margin-top:5px; }
    .btn-detail:hover { background:var(--orange-light); color:var(--orange); border-color:var(--orange); }

    /* Return detail modal — same pattern as admin-tickets.html */
    .detail-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:900; align-items:center; justify-content:center; padding:20px; }
    .detail-overlay.open { display:flex; }
    .detail-modal { background:var(--bg-card); border-radius:18px; border:1px solid var(--border); width:100%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .detail-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg-card); z-index:1; border-radius:18px 18px 0 0; }
    .detail-title { font-size:16px; font-weight:700; color:var(--text-primary); }
    .detail-close { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:6px; display:flex; align-items:center; }
    .detail-close:hover { color:var(--text-primary); background:var(--bg-subtle); }
    .detail-body { padding:24px; }
    .detail-section { margin-bottom:20px; }
    .detail-section-title { font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--orange); margin-bottom:12px; }
    .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .detail-field label { font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:.4px; text-transform:uppercase; display:block; margin-bottom:3px; }
    .detail-field span  { font-size:14px; color:var(--text-primary); font-weight:500; }
    .detail-divider { border:none; border-top:1px solid var(--border); margin:16px 0; }
    .detail-empty { color:var(--text-muted); font-style:italic; font-size:13px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>
    <div class="main-content">
      <div class="topbar">
        <div>
          <div class="topbar-title" data-i18n="ret.title">Returns</div>
          <div class="topbar-sub">ขาคืนของ Ticket ที่ช่างส่งของกลับมา — ยืนยันเมื่อของถึง DHL</div>
        </div>
      </div>

      <div class="page-body">
        <!-- Return legs in progress: รอ (waiting to ship) / เดินทาง (in transit — confirm here) -->
        <div class="card">
          <div class="section-head" style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:24px 24px 0;">
            <div class="section-accent" style="width:4px;height:22px;background:var(--orange);border-radius:2px;"></div>
            <span class="section-title" style="font-size:16px;font-weight:700;">กำลังคืน (รอ / เดินทาง)</span>
            <span class="section-count" id="onhand-count">—</span>
          </div>
          <div class="tbl-wrap" style="padding:0 24px 24px;">
            <table>
              <thead>
                <tr>
                  <th data-i18n="ret.col.ticket">Ticket</th>
                  <th data-i18n="ret.col.tech">Technician</th>
                  <th data-i18n="ret.col.part">Parts (คืน)</th>
                  <th>Return Address</th>
                  <th data-i18n="col.status">Status</th>
                  <th>Action</th>
                  <th>รายละเอียด</th>
                </tr>
              </thead>
              <tbody id="onhand-tbody">
                <tr><td colspan="7" class="empty-state" data-i18n="connecting">Connecting…</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Return History: closed (สถานะ คืน) -->
        <div class="card">
          <div class="section-head" style="display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:24px 24px 0;">
            <div class="section-accent" style="width:4px;height:22px;background:var(--orange);border-radius:2px;"></div>
            <span class="section-title" style="font-size:16px;font-weight:700;" data-i18n="ret.history">Return History</span>
          </div>
          <div class="tbl-wrap" style="padding:0 24px 24px;">
            <table>
              <thead>
                <tr>
                  <th data-i18n="ret.col.ticket">Ticket</th>
                  <th data-i18n="ret.col.tech">Technician</th>
                  <th data-i18n="ret.col.part">Parts (คืน)</th>
                  <th>Return Address</th>
                  <th data-i18n="ret.col.date">Updated</th>
                  <th>รายละเอียด</th>
                </tr>
              </thead>
              <tbody id="history-tbody">
                <tr><td colspan="6" class="empty-state" data-i18n="connecting">Connecting…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
    <div class="detail-modal" id="detailModal">
        <div class="detail-header">
            <span class="detail-title" id="detailTitle">Return Detail</span>
            <button class="detail-close" onclick="closeDetailModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="detail-body" id="detailBody"></div>
    </div>
  </div>

  <script src="shared/translations.js?v=11"></script>
  <script src="shared/toast.js?v=11"></script>
  <script src="shared/api.js?v=11"></script>
  <script src="shared/layout.js?v=11"></script>
  <script src="admin-returns.js?v=11"></script>
</body>
</html>
