<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History — ATM Inventory</title>
  <link rel="stylesheet" href="shared/styles.css?v=53">
  <style>
    /* Filter bar */
    .filter-grid { display:grid; grid-template-columns:1fr 1fr auto; gap:16px; align-items:end; margin-bottom:20px; padding:20px; background:var(--bg-subtle); border-radius:10px; border:1px solid var(--border); }
    .filter-group { display:flex; flex-direction:column; }
    .filter-label { font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:.5px; text-transform:uppercase; margin-bottom:8px; }
    .filter-input, .filter-select { padding:10px 14px; border:1.5px solid var(--border); border-radius:9px; background:var(--bg-input); color:var(--text-primary); font-family:inherit; font-size:13px; transition:.2s; outline:none; }
    .filter-input:focus, .filter-select:focus { border-color:var(--orange); box-shadow:0 0 0 3px var(--orange-ring); }
    .filter-input::placeholder { color:var(--text-muted); }

    .result-bar { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .result-count { font-size:13px; color:var(--text-secondary); }
    .result-count strong { color:var(--text-primary); }

    .id-chip   { font-size:12px; font-weight:600; color:var(--text-muted); background:var(--bg-subtle); padding:3px 8px; border-radius:5px; font-family:monospace; border:1px solid var(--border); }
    .date-chip { font-size:12px; font-weight:500; color:var(--text-secondary); background:var(--bg-subtle); padding:4px 10px; border-radius:6px; border:1px solid var(--border); display:inline-block; }
    .sub-text  { font-size:12px; color:var(--text-muted); margin-top:3px; display:block; }
    .fw-600    { font-weight:600; }

    .badge-pending  { background:var(--yellow-light); color:var(--yellow); }
    .badge-pending  .badge-dot { background:var(--yellow); }
    .badge-approved { background:var(--orange-light); color:var(--orange); }
    .badge-approved .badge-dot { background:var(--orange); }
    .badge-teal     { background:#e0f5f3; color:#0f8a7e; }
    .badge-teal     .badge-dot { background:#0f8a7e; }
    [data-theme="dark"] .badge-teal { background:rgba(15,138,126,.18); color:#4fd6c6; }
    [data-theme="dark"] .badge-teal .badge-dot { background:#4fd6c6; }
    .badge-success  { background:var(--green-light);  color:var(--green); }
    .badge-success  .badge-dot { background:var(--green); }
    .badge-danger   { background:var(--red-light);    color:var(--red);   }
    .badge-danger   .badge-dot { background:var(--red); }
    .badge-muted    { background:var(--bg-subtle); color:var(--text-secondary); }
    .badge-muted    .badge-dot { background:var(--text-secondary); }
    .badge-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }

    .btn-detail { background:var(--bg-subtle); color:var(--text-secondary); border:1.5px solid var(--border); padding:6px 12px; border-radius:7px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit; transition:all .15s; display:inline-flex; align-items:center; gap:4px; }
    .btn-detail:hover { background:var(--orange-light); color:var(--orange); border-color:var(--orange); }

    /* Detail modal — same pattern as admin-tickets.html */
    .detail-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:900; align-items:center; justify-content:center; padding:20px; }
    .detail-overlay.open { display:flex; }
    .detail-modal  { background:var(--bg-card); border-radius:18px; border:1px solid var(--border); width:100%; max-width:580px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.25); }
    .detail-header { display:flex; align-items:center; justify-content:space-between; padding:20px 24px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg-card); z-index:1; border-radius:18px 18px 0 0; }
    .detail-title  { font-size:16px; font-weight:700; color:var(--text-primary); }
    .detail-close  { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:4px; border-radius:6px; display:flex; align-items:center; }
    .detail-close:hover { color:var(--text-primary); background:var(--bg-subtle); }
    .detail-body   { padding:24px; }
    .detail-section { margin-bottom:20px; }
    .detail-section-title { font-size:10px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--orange); margin-bottom:12px; }
    .detail-grid   { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .detail-field label { font-size:11px; font-weight:600; color:var(--text-muted); letter-spacing:.4px; text-transform:uppercase; display:block; margin-bottom:3px; }
    .detail-field span  { font-size:14px; color:var(--text-primary); font-weight:500; }
    .detail-divider { border:none; border-top:1px solid var(--border); margin:16px 0; }
    .detail-empty  { color:var(--text-muted); font-style:italic; font-size:13px; }

    @media(max-width:768px) { .filter-grid { grid-template-columns:1fr; } .detail-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-root"></div>
  <div class="main-content">

    <div class="topbar">
      <div>
        <div class="topbar-title">ประวัติ</div>
        <div class="topbar-sub">ประวัติ Ticket เบิก/คืนอะไหล่ทั้งหมด — ดูรายละเอียด เวลา และรูปภาพที่แนบ</div>
      </div>
    </div>

    <div class="page-body">
      <div class="card">
        <div class="card-body">

          <div class="filter-grid">
            <div class="filter-group">
              <span class="filter-label">ค้นหาช่าง / Ticket</span>
              <input type="text" id="searchInput" class="filter-input"
                     placeholder="ชื่อช่าง, แผนก, หรือเลข Ticket…"
                     oninput="applyFilters()">
            </div>
            <div class="filter-group">
              <span class="filter-label">กรองตามสถานะ</span>
              <select id="statusFilter" class="filter-select" onchange="applyFilters()">
                <option value="">— ทุกสถานะ —</option>
                <option value="รอ">รอ</option>
                <option value="รออะไหล่">รออะไหล่</option>
                <option value="รอส่งเมล DHL">รอส่งเมล DHL</option>
                <option value="อนุมัติคืน">อนุมัติคืน</option>
                <option value="เดินทาง">เดินทาง</option>
                <option value="เบิก">เบิก</option>
                <option value="คืน">คืน</option>
                <option value="Reject">ปฏิเสธ</option>
                <option value="Cancel">ยกเลิก</option>
              </select>
            </div>
          </div>

          <div class="result-bar">
            <span class="result-count">แสดง <strong id="result-count">—</strong> รายการ</span>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th style="width:9%">ตั๋ว</th>
                  <th style="width:14%">ช่าง</th>
                  <th style="width:9%">ขั้นตอน</th>
                  <th style="width:24%">อะไหล่</th>
                  <th style="width:11%">วันที่สร้าง</th>
                  <th style="width:12%">สถานะ</th>
                  <th style="width:12%">รายละเอียด</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="7" class="empty-state">กำลังเชื่อมต่อเซิร์ฟเวอร์…</td></tr>
              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="detail-modal">
    <div class="detail-header">
      <span class="detail-title" id="detailTitle">รายละเอียดตั๋ว</span>
      <button class="detail-close" onclick="closeDetailModal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<script src="shared/translations.js?v=53"></script>
<script src="shared/toast.js?v=53"></script>
<script src="shared/api.js?v=53"></script>
<script src="shared/layout.js?v=53"></script>
<script>
  const CONDITION_LABEL = { Good: 'ของดี', Bad: 'ของเสีย', Lost: 'สูญหาย' };
  let allTickets = [];

  initLayout();
  window.addEventListener('DOMContentLoaded', fetchHistory);

  async function fetchHistory() {
    try {
      // A Ticket with no return leg started (Status still null) can still have withdraw
      // activity worth showing in history now that the withdraw leg lives on WithdrawBatch.
      allTickets = (await api.tickets.getAll()).filter(tk => tk.status !== null || (tk.withdrawBatches || []).length > 0);
      renderTable(allTickets);
    } catch {
      document.getElementById('historyTableBody').innerHTML =
        `<tr><td colspan="7" class="empty-state" style="color:var(--red)">⚠ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</td></tr>`;
    }
  }

  const STATUS_BADGE = {
    "รอ":        { cls: "badge-pending",  label: "รอ" },
    "รออะไหล่":  { cls: "badge-danger",   label: "รออะไหล่" },
    "รอส่งเมล DHL": { cls: "badge-pending", label: "รอส่งเมล DHL" },
    "อนุมัติคืน": { cls: "badge-approved", label: "อนุมัติคืน" },
    "กำลังเดินทางรับคืน": { cls: "badge-approved", label: "กำลังเดินทางรับคืน" },
    "เดินทาง":   { cls: "badge-approved", label: "เดินทาง" },
    "เบิก":      { cls: "badge-teal",     label: "เบิก" },
    "คืน":       { cls: "badge-success",  label: "คืน" },
    "Reject":    { cls: "badge-danger",   label: "ปฏิเสธ" },
    "Cancel":    { cls: "badge-muted",    label: "ยกเลิก" },
  };

  function renderTable(data) {
    const tbody = document.getElementById('historyTableBody');
    document.getElementById('result-count').textContent = data.length;
    tbody.innerHTML = '';

    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state">🗂 ไม่พบข้อมูล</td></tr>`;
      return;
    }

    const locale = 'th-TH';
    data.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach(tk => {
      const reqDate = tk.createdAt ? new Date(tk.createdAt).toLocaleDateString(locale) : '—';
      const b = STATUS_BADGE[tk.displayStatus] || STATUS_BADGE["รอ"];
      const badge = `<span class="badge ${b.cls}"><span class="badge-dot"></span>${b.label}</span>`;
      const batchCount = (tk.withdrawBatches || []).length;
      const batchLabel = batchCount ? `×${batchCount} ใบเบิก` : '—';
      const withdrawLines = (tk.withdrawBatches || []).flatMap(bt => bt.lines.map(l => ({ ...l, lineType: 'Withdraw' })));
      const allLines = [...withdrawLines, ...tk.lines];
      const partsSummary = allLines.length
        ? allLines.map(l => `<div style="font-size:12px;">${l.partName} <span class="sub-text" style="display:inline">×${l.quantity}</span> <span style="font-size:10px;color:var(--text-muted)">(${l.lineType === 'Withdraw' ? 'เบิก' : 'คืน'}${l.condition ? ' — ' + CONDITION_LABEL[l.condition] : ''})</span></div>`).join('')
        : `<span class="sub-text">—</span>`;

      tbody.innerHTML += `
        <tr>
          <td><span class="id-chip">${tk.externalTicketNo}</span></td>
          <td><span class="fw-600">${tk.techName || '—'}</span><span class="sub-text">${tk.techDept || ''}</span></td>
          <td style="font-size:12px;color:var(--text-secondary);">${batchLabel}</td>
          <td>${partsSummary}</td>
          <td><span class="date-chip">${reqDate}</span></td>
          <td>${badge}</td>
          <td><button class="btn-detail" onclick="showDetail(${tk.ticketId})">🔍 ดูรายละเอียด</button></td>
        </tr>`;
    });
  }

  function attachmentGalleryHtml(list) {
    if (!list || !list.length) return `<span class="detail-empty">—</span>`;
    return `<div style="display:flex;flex-wrap:wrap;gap:8px;">${list.map(a => `
        <img src="${IMG_BASE}${a.filePath}" alt="${a.fileName}"
             style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer;"
             onclick="window.open('${IMG_BASE}${a.filePath}','_blank')">`).join('')}</div>`;
  }

  /* ── Detail Modal ── */
  function showDetail(id) {
    const tk = allTickets.find(t => t.ticketId === id);
    if (!tk) return;

    const none = `<span class="detail-empty">ไม่ระบุ</span>`;
    const fmt  = d => d ? new Date(d).toLocaleString('th-TH') : '—';

    const returnLines = tk.lines; // Return-phase lines only, per API shape
    const lineListHtml = list => list.length
      ? list.map(l => `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);"><span>${l.partName}${l.condition ? ` <span style="color:var(--text-muted);font-size:11px;">(${CONDITION_LABEL[l.condition]})</span>` : ''}${l.isOffTicket ? ' <span style="font-size:10px;color:var(--orange);">🆕 นอกใบเบิก</span>' : ''}</span><span class="fw-600">×${l.quantity}</span></div>`).join('')
      : `<span class="detail-empty">—</span>`;
    // One read-only card per WithdrawBatch — each ran its own independent lifecycle.
    const batchCardHtml = batch => {
      const bBadge = STATUS_BADGE[batch.status] || STATUS_BADGE["รอ"];
      return `
        <div class="detail-section" style="background:var(--bg-subtle);border:1px solid var(--border);border-radius:10px;padding:14px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <span class="badge ${bBadge.cls}"><span class="badge-dot"></span>${bBadge.label}</span>
            <span style="font-size:11px;color:var(--text-muted);">${batch.withdrawSlipNo || 'ยังไม่ออกเลข'}</span>
          </div>
          <div class="detail-grid" style="margin-bottom:10px;">
            <div class="detail-field"><label>ผู้อนุมัติ</label><span>${batch.approverName || none}</span></div>
            <div class="detail-field"><label>อนุมัติเมื่อ</label><span>${fmt(batch.approvedAt)}</span></div>
            <div class="detail-field full"><label>ที่อยู่จัดส่ง</label><span>${batch.withdrawAddress || none}</span></div>
          </div>
          ${lineListHtml(batch.lines)}
          ${batch.withdrawDescription ? `<div style="margin-top:8px;font-size:13px;color:var(--text-primary);background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;white-space:pre-wrap;">${batch.withdrawDescription}</div>` : ''}
          ${(batch.attachments || []).length ? `<div style="margin-top:8px;">${attachmentGalleryHtml(batch.attachments)}</div>` : ''}
          ${batch.rejectReason ? `<div class="detail-empty" style="margin-top:8px;font-style:normal;color:var(--text-primary);">เหตุผลที่ Reject: ${batch.rejectReason}</div>` : ''}
        </div>`;
    };

    document.getElementById('detailTitle').textContent = `${tk.externalTicketNo} — ${tk.techName}`;

    document.getElementById('detailBody').innerHTML = `
      <div class="detail-section">
        <div class="detail-section-title">👤 ข้อมูลช่างเทคนิค</div>
        <div class="detail-grid">
          <div class="detail-field"><label>ชื่อ</label><span>${tk.techName || none}</span></div>
          <div class="detail-field"><label>แผนก / โซน</label><span>${tk.techDept || none}</span></div>
          <div class="detail-field"><label>สถานะ</label><span>${STATUS_BADGE[tk.displayStatus]?.label || tk.displayStatus || none}</span></div>
          <div class="detail-field"><label>อัปเดตล่าสุด</label><span>${fmt(tk.updatedAt)}</span></div>
        </div>
      </div>

      <hr class="detail-divider">

      <div class="detail-section">
        <div class="detail-section-title">📋 ใบเบิก (${(tk.withdrawBatches || []).length})</div>
        ${(tk.withdrawBatches || []).length ? tk.withdrawBatches.map(batchCardHtml).join('<div style="height:10px;"></div>') : `<span class="detail-empty">ยังไม่ได้ส่งคำขอเบิก</span>`}
      </div>

      <hr class="detail-divider">

      <div class="detail-section">
        <div class="detail-section-title">รายการอะไหล่ — คืน</div>
        ${tk.returnAddress ? `
        <div class="detail-grid" style="margin-bottom:10px;">
          <div class="detail-field"><label>สถานะฝั่งคืน</label><span>${STATUS_BADGE[tk.status]?.label || tk.status || none}</span></div>
          <div class="detail-field"><label>ที่อยู่จัดส่งคืน</label><span>${tk.returnAddress}</span></div>
        </div>` : ''}
        ${lineListHtml(returnLines)}
        ${(tk.attachments || []).length ? `<div style="margin-top:8px;">${attachmentGalleryHtml(tk.attachments)}</div>` : ''}
        ${tk.rejectReason ? `<div class="detail-empty" style="margin-top:8px;font-style:normal;color:var(--text-primary);">เหตุผลที่ Reject: ${tk.rejectReason}</div>` : ''}
      </div>
    `;

    document.getElementById('detailOverlay').classList.add('open');
  }

  function closeDetailModal() { document.getElementById('detailOverlay').classList.remove('open'); }
  function closeDetail(e) { if (e.target === document.getElementById('detailOverlay')) closeDetailModal(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetailModal(); });

  function applyFilters() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const status = document.getElementById('statusFilter').value;

    const filtered = allTickets.filter(tk => {
      const hay = `${tk.externalTicketNo} ${tk.techName} ${tk.techDept}`.toLowerCase();
      const matchSearch = !search || hay.includes(search);
      const matchStatus = !status || tk.status === status;
      return matchSearch && matchStatus;
    });

    renderTable(filtered);
  }
</script>
</body>
</html>
